name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, zip
      - name: Static cross-reference audit
        run: python3 tools/static_audit.py
      - name: Syntax check
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit, AI and database tests
        run: php tests/run.php
      - name: HTTP smoke test
        run: |
          php database/migrate.php
          php -S 127.0.0.1:8000 -t public public/index.php > /tmp/server.log 2>&1 &
          sleep 3
          php tests/http_smoke.php
